<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappetta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root {
  --bg:#F5F0E8;--bg2:#EDE8DE;--card:#FDFAF5;
  --text:#1A1814;--text2:#6B6559;
  --accent:#C4472A;--accent2:#E8A020;--border:#D8D0C0;
  --font-display:'DM Serif Display',Georgia,serif;
  --font-body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;transition:opacity .4s;}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--text2);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:13px;z-index:9000;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* LOGIN MODAL (solo per il proprietario) */
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,0.18);}
.auth-title{font-family:var(--font-display);font-size:24px;text-align:center;margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px;}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.form-field input{width:100%;font-family:var(--font-body);font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;}
.form-field input:focus{border-color:var(--accent);}
.btn{font-family:var(--font-body);font-size:13px;font-weight:500;padding:10px 20px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:all .15s;width:100%;}
.btn:hover{background:var(--bg2);}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent);}
.btn-primary:hover{background:#a83820;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;background:white;border-color:#ddd;}
.btn-google:hover{background:#f5f5f5;}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text2);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-error{font-size:12px;color:var(--accent);margin-bottom:12px;text-align:center;min-height:16px;}

/* APP VIEW */
#appView{flex:1;display:flex;flex-direction:column;overflow:hidden;}
header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100;}
.header-logo{font-family:var(--font-display);font-size:20px;letter-spacing:-.3px;}
.header-right{display:flex;align-items:center;gap:8px;}
.btn-sm{font-family:var(--font-body);font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:all .15s;}
.btn-sm:hover{background:var(--bg2);}
.btn-sm-primary{background:var(--accent);color:white;border-color:var(--accent);}
.btn-sm-primary:hover{background:#a83820;}
.btn-sm-danger{background:#fff0ee;color:var(--accent);border-color:#f5c4bb;}
.btn-sm-danger:hover{background:#fce0da;}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:300px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-top{padding:14px;border-bottom:1px solid var(--border);}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text2);}
.search-input{width:100%;font-family:var(--font-body);font-size:13px;padding:8px 10px 8px 34px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--accent);}
.filters{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
.chip{font-family:var(--font-body);font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.chip.active{background:var(--accent);color:white;border-color:var(--accent);}
.spots-count{font-size:11px;color:var(--text2);padding:8px 14px 4px;}
.spots-list{flex:1;overflow-y:auto;}
.spots-list::-webkit-scrollbar{width:4px;}
.spots-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* SPOT CARD */
.spot-card{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.spot-card:hover{background:var(--bg);}
.spot-card.active{background:#FEF5F2;border-left:3px solid var(--accent);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px;}
.spot-name{font-size:13px;font-weight:500;line-height:1.3;}
.spot-price{font-size:12px;color:var(--accent2);font-weight:500;flex-shrink:0;margin-left:6px;}
.spot-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.spot-cat{font-size:11px;color:var(--text2);background:var(--bg2);padding:2px 6px;border-radius:4px;}
.stars{font-size:11px;}
.spot-review{font-size:12px;color:var(--text2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.card-actions{display:flex;gap:5px;margin-top:8px;}
.card-action-btn{font-family:var(--font-body);font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text2);transition:all .12s;}
.card-action-btn:hover{background:var(--bg2);}
.card-action-btn.delete{color:var(--accent);border-color:#f5c4bb;}
.card-action-btn.delete:hover{background:#fff0ee;}

/* MAP */
#map{flex:1;z-index:1;}

/* POPUP */
.leaflet-popup-content-wrapper{background:var(--card);border-radius:10px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.12);padding:0;overflow:hidden;}
.leaflet-popup-content{margin:0;width:260px!important;}
.leaflet-popup-tip{background:var(--card);}
.popup-inner{padding:14px;}
.popup-name{font-family:var(--font-display);font-size:15px;margin-bottom:4px;}
.popup-meta{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.popup-cat{font-size:11px;color:var(--text2);background:var(--bg2);padding:2px 6px;border-radius:4px;}
.popup-price{font-size:12px;color:var(--accent2);font-weight:500;}
.popup-addr{font-size:11px;color:var(--text2);margin-bottom:6px;}
.popup-review{font-size:12px;line-height:1.5;margin-bottom:8px;}
.popup-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--border);}
.popup-btn{font-family:var(--font-body);font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text2);transition:all .12s;}
.popup-btn:hover{background:var(--bg2);}
.popup-btn.delete{color:var(--accent);border-color:#f5c4bb;}
.popup-btn.delete:hover{background:#fff0ee;}

/* SPOT MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px;width:400px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal h2{font-family:var(--font-display);font-size:20px;margin-bottom:18px;}
.form-row{margin-bottom:13px;}
.form-row label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.form-row input,.form-row textarea,.form-row select{width:100%;font-family:var(--font-body);font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent);}
.form-row textarea{height:78px;resize:vertical;}
.rating-input{display:flex;align-items:center;gap:8px;}
.rating-input input{width:90px;flex:none;}
.rating-input span{font-size:12px;color:var(--text2);}
.rating-badge{font-size:12px;font-weight:500;color:var(--accent2);}
.form-row-half{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px;}
.modal-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.modal-footer-right{display:flex;gap:8px;}
.edit-badge{display:inline-block;font-size:10px;background:var(--accent2);color:white;padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:middle;}

/* AUTOCOMPLETE */
.suggestions-box{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:200;max-height:200px;overflow-y:auto;}
.suggestion-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.suggestion-item:last-child{border-bottom:none;}
.suggestion-item:hover{background:var(--bg2);}
.suggestion-name{font-size:13px;font-weight:500;margin-bottom:2px;}
.suggestion-addr{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.suggestion-loading,.suggestion-empty{padding:12px;font-size:12px;color:var(--text2);text-align:center;}

/* CONFIRM DIALOG */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px;width:320px;box-shadow:0 8px 40px rgba(0,0,0,.2);}
.confirm-box h3{font-family:var(--font-display);font-size:18px;margin-bottom:8px;}
.confirm-box p{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:20px;}
.confirm-footer{display:flex;justify-content:flex-end;gap:8px;}

/* MARKER */
.custom-marker{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,.25);background:var(--accent);}
.custom-marker span{transform:rotate(45deg);font-size:13px;line-height:1;}

.empty-state{padding:32px 16px;text-align:center;color:var(--text2);}
.empty-state p{font-size:13px;line-height:1.6;}

/* RESPONSIVE */
@media (max-width:720px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;height:40%;border-right:none;border-bottom:1px solid var(--border);}
  #map{flex:1;min-height:0;}
  .header-logo{font-size:17px;}
  .btn-sm{padding:6px 10px;font-size:11px;}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Caricamento…</div>
</div>
<div class="toast" id="toast"></div>

<!-- ===== APP VIEW (sempre visibile, pubblica in sola lettura) ===== -->
<div id="appView">
  <header>
    <span class="header-logo">Mappetta</span>
    <div class="header-right">
      <button class="btn-sm btn-sm-primary" id="addSpotBtn" onclick="openModal()" style="display:none">+ Aggiungi</button>
      <button class="btn-sm" id="importBtn" onclick="bulkImportSpots()" style="display:none">📥 Importa 67 posti</button>
      <button class="btn-sm" id="loginBtn" onclick="openLoginModal()">🔒 Accedi</button>
      <button class="btn-sm" id="logoutBtn" onclick="logout()" style="display:none">Esci</button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-input" id="searchInput" placeholder="Cerca posti…" oninput="renderAll()">
        </div>
        <div class="filters" id="filters">
          <button class="chip active" data-cat="all">Tutti</button>
          <button class="chip" data-cat="Ristorante">Ristorante</button>
          <button class="chip" data-cat="Pizzeria">Pizzeria</button>
          <button class="chip" data-cat="Bar">Bar</button>
          <button class="chip" data-cat="Caffè">Caffè</button>
          <button class="chip" data-cat="Aperitivo">Aperitivo</button>
          <button class="chip" data-cat="Gelato">Gelato</button>
          <button class="chip" data-cat="Colazione">Colazione</button>
          <button class="chip" data-cat="Panifici">Panifici</button>
          <button class="chip" data-cat="Hamburger">Hamburger</button>
          <button class="chip" data-cat="Misto">Misto</button>
        </div>
      </div>
      <div class="spots-count" id="spotsCount"></div>
      <div class="spots-list" id="spotsList"></div>
    </div>
    <div id="map"></div>
  </div>
</div>

<!-- LOGIN MODAL (solo per il proprietario del sito) -->
<div class="modal-overlay" id="loginOverlay">
  <div class="auth-card">
    <div class="auth-title">Accedi</div>
    <div class="auth-sub">Solo per modificare la mappa</div>
    <button class="btn btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/><path fill="#34A853" d="M6.3 14.7l7 5.1C15.2 16 19.2 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 16.3 2 9.7 7.4 6.3 14.7z"/><path fill="#FBBC05" d="M24 46c5.9 0 10.9-2 14.6-5.4l-6.7-5.5C29.8 36.9 27.1 38 24 38c-6.1 0-11.3-4.1-13.2-9.7l-6.9 5.3C7.7 41.5 15.3 46 24 46z"/><path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.9 2.9-2.8 5.3-5.3 6.9l6.7 5.5C41.7 37.2 46 31.3 46 24c0-1.3-.2-2.7-.5-4z"/></svg>
      Continua con Google
    </button>
    <div class="divider">oppure</div>
    <div class="auth-error" id="authError"></div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="tu@email.com">
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="submitAuth()">Accedi</button>
    <button class="btn" style="margin-top:8px" onclick="closeLoginModal()">Annulla</button>
  </div>
</div>

<!-- SPOT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Aggiungi un posto</h2>
    <div id="searchSection">
      <div class="form-row" style="position:relative">
        <label>Cerca il posto 🔍</label>
        <input id="fSearch" placeholder="es. Pizzeria Spontini Milano" autocomplete="off" oninput="onSearchInput()" onfocus="showSuggestions()">
        <div id="suggestions" class="suggestions-box" style="display:none"></div>
      </div>
      <div id="selectedPlace" style="display:none;margin-bottom:13px;padding:9px 11px;background:var(--bg2);border-radius:6px;border:1px solid var(--border)">
        <div style="font-size:11px;color:var(--text2);margin-bottom:2px">Selezionato</div>
        <div id="selectedPlaceName" style="font-size:13px;font-weight:500"></div>
        <div id="selectedPlaceAddr" style="font-size:12px;color:var(--text2);margin-top:2px"></div>
      </div>
    </div>
    <div class="form-row">
      <label>Nome *</label>
      <input id="fName" placeholder="es. Trattoria da Mario">
    </div>
    <input type="hidden" id="fAddr">
    <input type="hidden" id="fLat">
    <input type="hidden" id="fLng">
    <div class="form-row-half">
      <div class="form-row" style="margin-bottom:0">
        <label>Categoria</label>
        <select id="fCat">
          <option>Ristorante</option><option>Pizzeria</option>
          <option>Bar</option><option>Caffè</option>
          <option>Aperitivo</option><option>Gelato</option>
          <option>Colazione</option><option>Panifici</option>
          <option>Hamburger</option><option>Misto</option>
        </select>
      </div>
      <div class="form-row" style="margin-bottom:0">
        <label>Prezzo</label>
        <select id="fPrice">
          <option value="€">€</option>
          <option value="€€" selected>€€</option>
          <option value="€€€">€€€</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-top:13px">
      <label>Voto</label>
      <div class="rating-input">
        <input type="number" id="fRating" min="1" max="10" step="0.25" value="8">
        <span>/ 10</span>
      </div>
    </div>
    <div class="form-row">
      <label>Recensione</label>
      <textarea id="fReview" placeholder="Cosa hai mangiato? Cosa consigli?"></textarea>
    </div>
    <div class="modal-footer">
      <div>
        <button class="btn-sm btn-sm-danger" id="deleteFromModal" style="display:none" onclick="deleteFromModalFn()">🗑 Elimina</button>
      </div>
      <div class="modal-footer-right">
        <button class="btn-sm" onclick="closeModal()">Annulla</button>
        <button class="btn-sm btn-sm-primary" id="saveBtn" onclick="saveSpot()">Salva</button>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Eliminare questo posto?</h3>
    <p id="confirmText">Questa azione non può essere annullata.</p>
    <div class="confirm-footer">
      <button class="btn-sm" onclick="closeConfirm()">Annulla</button>
      <button class="btn-sm btn-sm-danger" id="confirmDeleteBtn">Sì, elimina</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// FIREBASE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAM4e_WeacF_3YeiUytaQd4rl0sMu0EwSI",
  authDomain: "mappetta-9d25c.firebaseapp.com",
  projectId: "mappetta-9d25c",
  storageBucket: "mappetta-9d25c.firebasestorage.app",
  messagingSenderId: "520166113779",
  appId: "1:520166113779:web:6a62030466b0cd6dc81286"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ============================================================
// STATE
// ============================================================
let currentUser = null;     // null = visitatore (sola lettura), altrimenti sei tu (proprietario)
let spots = [];
let currentFilter = 'all';
let selectedId = null;
let unsubSpots = null;

// ============================================================
// AUTH — la mappa è sempre visibile a tutti.
// Il login serve solo a sbloccare i pulsanti di modifica.
// La vera protezione dei dati è nelle regole di Firestore (solo
// il tuo UID può scrivere), non in questo controllo lato client.
// ============================================================
function openLoginModal() {
  document.getElementById('authError').textContent = '';
  document.getElementById('loginOverlay').classList.add('open');
}
function closeLoginModal() {
  document.getElementById('loginOverlay').classList.remove('open');
}

async function loginGoogle() {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    closeLoginModal();
  } catch(e) { showAuthError(e.message); }
}

async function submitAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  if (!email || !pass) return showAuthError('Inserisci email e password.');
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    closeLoginModal();
  } catch(e) {
    const msgs = {
      'auth/user-not-found': 'Utente non trovato.',
      'auth/wrong-password': 'Password errata.',
      'auth/invalid-email': 'Email non valida.'
    };
    showAuthError(msgs[e.code] || e.message);
  }
}

function showAuthError(msg) { document.getElementById('authError').textContent = msg; }

function logout() { auth.signOut(); }

auth.onAuthStateChanged(user => {
  currentUser = user;

});

let map = null;
let markers = {};

map = L.map('map',{zoomControl:true}).setView([45.4654,9.1859],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CartoDB',subdomains:'abcd',maxZoom:19
}).addTo(map);

const catEmoji = {"Ristorante":"🍽","Pizzeria":"🍕","Bar":"🍹","Caffè":"☕","Aperitivo":"🥂","Gelato":"🍦","Colazione":"🥐","Panifici":"🍞","Hamburger":"🍔","Misto":"🛍"};

function makeMarker(spot) {
  const emoji = catEmoji[spot.cat] || '📍';
  const icon = L.divIcon({
    className:'',
    html:`<div class="custom-marker"><span>${emoji}</span></div>`,
    iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-32]
  });
  const actionsHtml = currentUser
    ? `<div class="popup-actions">
        <button class="popup-btn" onclick="openEditModal('${spot.id}')">✏️ Modifica</button>
        <button class="popup-btn delete" onclick="askDelete('${spot.id}','${spot.name.replace(/'/g,"\\'")}')">🗑 Elimina</button>
      </div>`
    : '';
  const m = L.marker([spot.lat,spot.lng],{icon})
    .bindPopup(`<div class="popup-inner">
      <div class="popup-name">${spot.name}</div>
      <div class="popup-meta">
        <span class="popup-cat">${spot.cat}</span>
        <span class="popup-price">${spot.price}</span>
        <span class="rating-badge">${spot.stars}/10</span>
      </div>
      <div class="popup-addr">📍 ${spot.addr}</div>
      <div class="popup-review">${spot.review}</div>
      ${actionsHtml}
    </div>`,{maxWidth:280}).addTo(map);
  m.on('click',()=>{selectedId=spot.id;renderList();scrollToCard(spot.id);});
  return m;
}

function refreshMarkers() {
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};
  getFiltered().forEach(s=>{markers[s.id]=makeMarker(s);});
}

// ============================================================
// LISTA
// ============================================================
function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return spots.filter(s => {
    const mc = currentFilter==='all' || s.cat===currentFilter;
    const mq = !q || s.name.toLowerCase().includes(q) || s.addr.toLowerCase().includes(q) || s.review.toLowerCase().includes(q);
    return mc && mq;
  });
}

function renderList() {
  const filtered = getFiltered();
  document.getElementById('spotsCount').textContent = `${filtered.length} posto${filtered.length!==1?'i':''}`;
  const list = document.getElementById('spotsList');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><p>Nessun posto trovato.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(s => {
    const safeN = s.name.replace(/'/g,"\\'");
    const actionsHtml = currentUser
      ? `<div class="card-actions">
          <button class="card-action-btn" onclick="event.stopPropagation();openEditModal('${s.id}')">✏️ Modifica</button>
          <button class="card-action-btn delete" onclick="event.stopPropagation();askDelete('${s.id}','${safeN}')">🗑 Elimina</button>
        </div>` : '';
    return `<div class="spot-card${selectedId===s.id?' active':''}" id="card-${s.id}" onclick="selectSpot('${s.id}')">
      <div class="card-top"><span class="spot-name">${s.name}</span><span class="spot-price">${s.price}</span></div>
      <div class="spot-meta"><span class="spot-cat">${s.cat}</span><span class="rating-badge">${s.stars}/10</span></div>
      <div class="spot-review">${s.review}</div>
      ${actionsHtml}
    </div>`;
  }).join('');
}

function selectSpot(id) {
  selectedId = id;
  renderList();
  const s = spots.find(x=>x.id===id);
  if (s && markers[id]) { map.setView([s.lat,s.lng],15,{animate:true}); markers[id].openPopup(); }
}
function scrollToCard(id) {
  setTimeout(()=>{const c=document.getElementById('card-'+id);if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'});},100);
}
function renderAll() { renderList(); refreshMarkers(); }

// Filtri
document.getElementById('filters').addEventListener('click',e=>{
  const chip = e.target.closest('.chip');
  if (!chip) return;
  currentFilter = chip.dataset.cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.cat===currentFilter));
  renderAll();
});

async function bulkImportSpots() {
  if (!currentUser) return;
  if (!confirm(`Importare ${TEMP_IMPORT_DATA.length} posti nella mappa? Fallo una sola volta.`)) return;
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  let done = 0;
  for (const s of TEMP_IMPORT_DATA) {
    try {
      await db.collection('spots').add({
        ...s,
        ownerId: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      done++;
      btn.textContent = `📥 ${done}/${TEMP_IMPORT_DATA.length}…`;
    } catch (e) {
      console.error('Errore importando', s.name, e);
    }
  }
  btn.textContent = `✅ Importati ${done}`;
  showToast(`✅ Importati ${done} posti su ${TEMP_IMPORT_DATA.length}`);
}

function loadSpots() {
  unsubSpots = db.collection('spots').orderBy('createdAt','desc').onSnapshot(snap => {
    spots = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderAll();
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, err => {
    console.error(err);
    showToast('Errore caricamento posti');
    document.getElementById('loadingOverlay').classList.add('hidden');
  });
}

  if (!s) return;
  editingId=id;
  document.getElementById('modalTitle').innerHTML='Modifica posto <span class="edit-badge">modifica</span>';
  document.getElementById('saveBtn').textContent='Aggiorna';
  document.getElementById('searchSection').style.display='none';
  document.getElementById('deleteFromModal').style.display='inline-flex';
  document.getElementById('fName').value=s.name;
  document.getElementById('fAddr').value=s.addr;
  document.getElementById('fLat').value=s.lat;
  document.getElementById('fLng').value=s.lng;
  document.getElementById('fReview').value=s.review;
  document.getElementById('fCat').value=s.cat;
  document.getElementById('fPrice').value=s.price;
  document.getElementById('fRating').value=s.stars;
  map.closePopup();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('suggestions').style.display='none';
  editingId=null;
}

// GEOCODING
let searchTimer=null;
function onSearchInput(){
  const q=document.getElementById('fSearch').value.trim();
  clearTimeout(searchTimer);
  if(q.length<3){document.getElementById('suggestions').style.display='none';return;}
  document.getElementById('suggestions').innerHTML='<div class="suggestion-loading">Cerco…</div>';
  document.getElementById('suggestions').style.display='block';
  searchTimer=setTimeout(()=>searchPlaces(q),400);
}
function showSuggestions(){
  const b=document.getElementById('suggestions');
  if(b.innerHTML.trim()&&document.getElementById('fSearch').value.length>=3)b.style.display='block';
}
async function searchPlaces(query){
  try{
    const q=query.toLowerCase().includes('milan')?query:query+' Milano';
    const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1&accept-language=it`;
    const res=await fetch(url,{headers:{'Accept-Language':'it'}});
    const results=await res.json();
    const box=document.getElementById('suggestions');
    if(!results.length){box.innerHTML='<div class="suggestion-empty">Nessun risultato.</div>';return;}
    box.innerHTML=results.map((r,i)=>`<div class="suggestion-item" onclick="selectPlace(${i})">
      <div class="suggestion-name">${r.name||r.display_name.split(',')[0]}</div>
      <div class="suggestion-addr">${r.display_name}</div></div>`).join('');
    box._results=results;box.style.display='block';
  }catch(e){document.getElementById('suggestions').innerHTML='<div class="suggestion-empty">Errore.</div>';}
}
function selectPlace(idx){
  const box=document.getElementById('suggestions'),r=box._results[idx];if(!r)return;
  const name=r.name||r.display_name.split(',')[0];
  const addr=r.display_name.split(', ').slice(0,3).join(', ');
  document.getElementById('fName').value=name;
  document.getElementById('fAddr').value=addr;
  document.getElementById('fLat').value=r.lat;
  document.getElementById('fLng').value=r.lon;
  document.getElementById('selectedPlaceName').textContent=name;
  document.getElementById('selectedPlaceAddr').textContent=addr;
  document.getElementById('selectedPlace').style.display='block';
  box.style.display='none';
  document.getElementById('fSearch').value=name;
  setTimeout(()=>document.getElementById('fReview').focus(),100);
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#fSearch')&&!e.target.closest('#suggestions'))
    document.getElementById('suggestions').style.display='none';
});

async function saveSpot(){
  if (!currentUser) return;
  const name=document.getElementById('fName').value.trim();
  const addr=document.getElementById('fAddr').value.trim();
  const lat=parseFloat(document.getElementById('fLat').value);
  const lng=parseFloat(document.getElementById('fLng').value);
  if(!name)return alert('Inserisci il nome del posto.');
  if(!addr||isNaN(lat)||isNaN(lng))return alert('Seleziona un posto dalla lista.');
  let rating=parseFloat(document.getElementById('fRating').value);
  if(isNaN(rating))rating=8;
  rating=Math.min(10,Math.max(1,rating));
  const btn=document.getElementById('saveBtn');
  btn.textContent='…';btn.disabled=true;
  const data={
    name,addr,cat:document.getElementById('fCat').value,
    price:document.getElementById('fPrice').value,
    stars:rating,
    review:document.getElementById('fReview').value.trim()||'Nessuna recensione.',
    lat,lng,
    ownerId:currentUser.uid
  };
  try{
    if(editingId){
      await db.collection('spots').doc(editingId).update(data);
      showToast('✅ Posto aggiornato!');
    }else{
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('spots').add(data);
      showToast('✅ Posto salvato!');
    }
    closeModal();
  }catch(e){console.error(e);alert('Errore nel salvataggio: '+e.message);}
  finally{btn.textContent=editingId?'Aggiorna':'Salva';btn.disabled=false;}
}

// DELETE
let pendingDeleteId=null;
function askDelete(id,name){
  if (!currentUser) return;
  pendingDeleteId=id;
  document.getElementById('confirmText').textContent=`Vuoi eliminare "${name}"?`;
  document.getElementById('confirmOverlay').classList.add('open');
  map.closePopup();
}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('open');pendingDeleteId=null;}
document.getElementById('confirmDeleteBtn').addEventListener('click',async()=>{
  if(!pendingDeleteId)return;
  try{await db.collection('spots').doc(pendingDeleteId).delete();closeConfirm();closeModal();showToast('🗑 Posto eliminato');}
  catch(e){alert('Errore eliminazione.');}
});
function deleteFromModalFn(){
  if(!editingId)return;
  const s=spots.find(x=>x.id===editingId);
  closeModal();askDelete(editingId,s?s.name:'questo posto');
}

document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});
document.getElementById('confirmOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('confirmOverlay'))closeConfirm();});
document.getElementById('loginOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('loginOverlay'))closeLoginModal();});

// ============================================================
// UTILS
// ============================================================
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
